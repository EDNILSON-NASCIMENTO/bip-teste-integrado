<div class="form-container card">
  <h2>{{ isEditMode ? 'Editar Benefício' : 'Adicionar Novo Benefício' }}</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="nome">Nome:</label>
      <input id="nome" type="text" formControlName="nome">
      <div *ngIf="form.get('nome')?.invalid && form.get('nome')?.touched" class="error-message">
        O nome é obrigatório.
      </div>
    </div>

    <div class="form-group">
      <label for="descricao">Descrição:</label>
      <textarea id="descricao" formControlName="descricao"></textarea>
    </div>

    <div class="form-group">
      <label for="valor">Valor (R$):</label>
      <input id="valor" type="number" formControlName="valor">
      <div *ngIf="form.get('valor')?.invalid && form.get('valor')?.touched" class="error-message">
        O valor deve ser maior que zero.
      </div>
    </div>

    <div class="form-group checkbox-group">
      <input id="ativo" type="checkbox" formControlName="ativo">
      <label for="ativo">Ativo</label>
    </div>

    <div class="form-actions">
      <button type="submit" [disabled]="form.invalid" class="btn btn-primary">
        {{ isEditMode ? 'Salvar Alterações' : 'Criar Benefício' }}
      </button>
      <button type="button" (click)="onCancel()" class="btn btn-secondary">
        Cancelar
      </button>
    </div>
  </form>
</div>
