<main class="content">
  <header>
    <h1>{{ title }}</h1>
  </header>

  <div class="toolbar">
    <button (click)="onNovoBeneficio()" class="btn btn-primary">
      Adicionar Novo Benefício
    </button>
  </div>

  <app-beneficio-form
    *ngIf="mostrarFormulario"
    [beneficio]="beneficioSelecionado"
    (save)="onFormSave($event)"
    (cancel)="onFormCancel()"
  ></app-beneficio-form>

  <div class="card" *ngIf="!mostrarFormulario">
    <h2>Lista de Benefícios</h2>

    <div *ngIf="isLoading" class="loading"><p>Carregando dados...</p></div>
    <div *ngIf="error" class="error"><p>{{ error }}</p></div>

    <div *ngIf="!isLoading && !error" class="table-container">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Valor (R$)</th>
            <th>Ativo</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let beneficio of beneficios">
            <td>{{ beneficio.id }}</td>
            <td>{{ beneficio.nome }}</td>
            <td>{{ beneficio.metadata['VALOR'] | number:'1.2-2' }}</td>
            <td>{{ beneficio.metadata['ATIVO'] === 'TRUE' ? 'Sim' : 'Não' }}</td>
            <td class="actions">
              <button (click)="onEditar(beneficio)" class="btn btn-secondary">Editar</button>
              <button (click)="onExcluir(beneficio.id)" class="btn btn-danger">Excluir</button>
            </td>
          </tr>
          <tr *ngIf="beneficios.length === 0">
            <td colspan="5" class="empty-state">Nenhum benefício encontrado.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
